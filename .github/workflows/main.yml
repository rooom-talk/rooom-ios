name: Build RoooM iOS App Store review candidate

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Exact 40-character merged release commit SHA"
        required: true
        type: string
      confirmation:
        description: "Explicit test-only Apple upload, no App Store release"
        required: true
        type: choice
        options: [DO_NOT_UPLOAD, UPLOAD_TESTFLIGHT]
        default: DO_NOT_UPLOAD

permissions:
  contents: read

concurrency:
  group: ios-review-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/ios-review-candidate-20261011' && inputs.confirmation == 'UPLOAD_TESTFLIGHT'
    runs-on: macos-latest

    steps:
      - name: Checkout explicitly approved release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false

      - name: Verify exact approved source and canonical branch
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'STOP: 40-character commit SHA required'; exit 1; }
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          CURRENT="$(gh api repos/rooom-talk/rooom-ios/branches/release/ios-review-candidate-20261011 --jq .commit.sha)"
          test "$CURRENT" = "$APPROVED_SHA" || { echo 'STOP: release branch has changed'; exit 1; }
          test "$GITHUB_REF" = 'refs/heads/release/ios-review-candidate-20261011'

      - name: Checkout pinned audited i-mobile 2.3.4 SDK on ephemeral Mac
        uses: actions/checkout@v4
        with:
          repository: imobile/adnw-sdk-ios
          ref: 736b6edc9ab6e1ada1b0dc557531370cf5923dc8
          path: vendor-sdk
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install verified TEST keyboard accessory controller
        run: npm install @capacitor/keyboard@8.0.6

      - name: Prepare verified production Capacitor settings
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const file = "capacitor.config.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          if (config.appId !== "com.rooom.talk" ||
              config.server?.url !== "https://rooom-talk.com/?rooom_native_generation=3" ||
              config.webDir !== "dist") {
            throw new Error("REVIEW STOP: app ID, production URL or web directory differs");
          }
          config.ios = { ...(config.ios || {}), scrollEnabled: true };
          config.plugins = {
            ...(config.plugins || {}),
            Keyboard: { resize: "none" }
          };
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Stage hash-verified official i-mobile SDK after Capacitor sync
        run: node scripts/stage-imobile-official-sdk.mjs "$GITHUB_WORKSPACE/vendor-sdk"

      - name: Guard production identity and verified TEST native owners
        run: |
          set -e
          grep -q 'RooomKeyboardContainerViewController' ios/App/App/SceneDelegate.swift
          grep -q 'keyboardWillChangeFrameNotification' ios/App/App/SceneDelegate.swift
          grep -q '"resize": "none"' capacitor.config.json
          # Keep WKWebView document scrolling enabled on iPhone and iPad.
          # Top Archive is a document-scroll page; disabling UIScrollView stops it.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          assert.equal(config.ios?.scrollEnabled, true, 'Native WKWebView scrolling must stay enabled');
          assert.equal(config.plugins?.Keyboard?.resize, 'none', 'Verified keyboard policy must stay unchanged');
          assert.equal(config.appId, 'com.rooom.talk');
          assert.equal(config.server?.url, 'https://rooom-talk.com/?rooom_native_generation=3');
          assert.equal(new URL(config.server.url).origin, 'https://rooom-talk.com');
          assert.equal(new URL(config.server.url).searchParams.get('rooom_native_generation'), '3');
          assert.equal(new URL(config.server.url).pathname, '/');
          assert.equal(config.server?.cleartext, false);
          // Capacitor 8.5: WebViewDelegationHandler compares navigations to the
          // full serverURL, including the generation query. Explicitly allow the
          // exact RoooM host so internal pages do not jump to Safari.
          assert.deepEqual(config.server?.allowNavigation, ['rooom-talk.com'],
            'Only the production RoooM hostname may navigate inside Native WebView');
          const allowedByHost = (uri) => config.server.allowNavigation.includes(new URL(uri, config.server.url).hostname);
          for (const path of ['/', '/room.html?id=sample', '/contact.html', '/?from=room']) {
            assert.equal(allowedByHost(path), true, 'RoooM navigation must stay inside WKWebView: '+path);
          }
          for (const external of ['https://example.com/', 'https://rooom-talk.com.evil.example/']) {
            assert.equal(allowedByHost(external), false, 'External host must remain outside WKWebView: '+external);
          }
          NODE
          grep -R -E -q 'CapacitorKeyboard|KeyboardPlugin|capacitor-keyboard' ios/App/CapApp-SPM
          grep -R -E -q 'FirebaseMessaging|capacitor-firebase.*messaging' ios/App/CapApp-SPM
          if grep -R -E -q 'PushNotifications|capacitor/push-notifications' ios/App/CapApp-SPM; then
            echo 'REVIEW STOP: duplicate iOS push plugin'
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' ios/App/App/GoogleService-Info.plist)" = 'room-app-d04eb'
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/App/App/GoogleService-Info.plist)" = 'com.rooom.talk'
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.rooom.talk;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 1.5;' ios/App/App.xcodeproj/project.pbxproj
          grep -q '#if ROOOM_IMOBILE_ADS' ios/App/App/SceneDelegate.swift
          grep -q 'private var config = RooomAdConfig.off' ios/App/App/RooomImobileBanner.swift
          grep -q 'rooom_native_generation=3' capacitor.config.json
          grep -q 'ROOOM_IMOBILE_ADS' ios/App/App.xcodeproj/project.pbxproj
          # All new APP placements are disabled by their production Web config.
          echo 'Verified TEST native keyboard, single Messaging owner and production signing identity'

      - name: Verify new TestFlight build number against App Store Connect
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {sign} from 'node:crypto';
          import fs from 'node:fs';
          const env=process.env;
          const key=(env.APP_STORE_CONNECT_PRIVATE_KEY||'').replace(/\\n/g,'\n');
          assert.ok(key.includes('BEGIN PRIVATE KEY'),'STOP: App Store Connect private key unavailable');
          assert.ok(env.APP_STORE_CONNECT_KEY_ID && env.APP_STORE_CONNECT_ISSUER_ID,'STOP: App Store Connect key metadata unavailable');
          const base64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
          const issued=Math.floor(Date.now()/1000);
          const input=base64({alg:'ES256',kid:env.APP_STORE_CONNECT_KEY_ID,typ:'JWT'})+'.'+base64({iss:env.APP_STORE_CONNECT_ISSUER_ID,iat:issued,exp:issued+900,aud:'appstoreconnect-v1'});
          const signature=sign('sha256',Buffer.from(input),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const token=input+'.'+signature;
          async function api(path){
            const res=await fetch('https://api.appstoreconnect.apple.com'+path,{headers:{Authorization:'Bearer '+token}});
            if(!res.ok)throw Error('STOP: Apple build lookup HTTP '+res.status);
            return res.json();
          }
          const apps=await api('/v1/apps?filter%5BbundleId%5D=com.rooom.talk&limit=10');
          assert.equal(apps.data?.length,1,'STOP: cannot identify unique RoooM app in Apple account');
          const appId=apps.data[0].id;
          let link='/v1/builds?filter%5Bapp%5D='+encodeURIComponent(appId)+'&limit=200&sort=-uploadedDate';
          let max=0, pages=0;
          while(link){
            assert.ok(++pages<=30,'STOP: Apple build listing exceeds 30 pages; manual reconciliation needed');
            const data=await api(link.startsWith('https:') ? new URL(link).pathname+new URL(link).search : link);
            for(const b of data.data||[]){const v=Number(b.attributes?.version);if(Number.isSafeInteger(v))max=Math.max(max,v);}
            link=data.links?.next||null;
          }
          const proposed=100000+Number(env.GITHUB_RUN_NUMBER);
          assert.ok(Number.isSafeInteger(proposed)&&proposed>max,'STOP: computed build number '+proposed+' is not greater than Apple latest '+max);
          fs.appendFileSync(env.GITHUB_ENV,'ROOOM_TESTFLIGHT_BUILD_NUMBER='+proposed+'\n');
          console.log('Apple build version preflight PASS: previous maximum '+max+', candidate '+proposed);
          NODE

      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Create archive
        run: |
          cd ios/App
          BUILD_NUMBER="${ROOOM_TESTFLIGHT_BUILD_NUMBER:?Apple build preflight missing}"
          echo "Review candidate build number: $BUILD_NUMBER"

          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/RoooM.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            APP_PROFILE="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=1.6 \
            clean archive

          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_TEMP/RoooM.xcarchive/Products/Applications/App.app/Info.plist" | grep -Fx '1.6'
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$RUNNER_TEMP/RoooM.xcarchive/Products/Applications/App.app/Info.plist" | grep -Fx 'com.rooom.talk'
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$RUNNER_TEMP/RoooM.xcarchive/Products/Applications/App.app/Info.plist" | grep -Fx "$BUILD_NUMBER"
          codesign --verify --deep --strict "$RUNNER_TEMP/RoooM.xcarchive/Products/Applications/App.app"
          test -f "$RUNNER_TEMP/RoooM.xcarchive/Products/Applications/App.app/embedded.mobileprovision"

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.rooom.talk</key>
                  <string>${PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          mkdir -p "$RUNNER_TEMP/export"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/RoooM.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # Public repository: do not upload the signed IPA to GitHub artifacts.
      # IPA exists only on the ephemeral Mac runner until Apple upload completes.

      - name: Prepare App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      # Build upload only. Review submission and public release are separate manual actions.
      - name: Upload TestFlight processing candidate to App Store Connect (NOT app review)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" -type f | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "IPA file not found"
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Explicit release boundary
        run: |
          echo 'TestFlight candidate upload attempted; Apple processing and tester access are separate.'
          echo 'NO App Store review submission, NO public release, NO Web/Firebase deploy.'
