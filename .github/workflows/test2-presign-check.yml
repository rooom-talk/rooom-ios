name: TEST2 presign gate tests (synthetic, no distribution)
on:
  pull_request:
    paths:
      - '.github/workflows/main.yml'
      - '.github/workflows/test2-presign-check.yml'
      - 'scripts/test2-presign*'
      - 'scripts/test2-diagnostic*'
      - 'scripts/cms-*'
      - 'scripts/presign-apple-roots/**'
      - 'tests/test2-presign*'
      - 'scripts/request-testflight.ps1'
      - 'tests/testflight-command.test.ps1'
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact source to test; never signs/uploads the app
        required: true
        type: string
      candidate_pull_request:
        description: Open same-repository candidate PR; omit for canonical validation
        required: false
        default: ''
        type: string
      confirmation:
        description: Validation only, never app signing or upload
        required: true
        default: SYNTHETIC_ONLY
        type: choice
        options: [SYNTHETIC_ONLY, DIAGNOSE_REAL_CMS_ONLY, INSPECT_CMS_CERTIFICATES_ONLY]
permissions:
  contents: read
jobs:
  profile-runtime:
    if: github.event_name != 'workflow_dispatch' || inputs.confirmation == 'SYNTHETIC_ONLY'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha || github.sha }}
          persist-credentials: false
      - name: Inspect system profile API availability without credentials
        run: swift tests/test2-presign-runtime.swift
  presign-gate:
    if: github.event_name != 'workflow_dispatch' || (inputs.confirmation != 'DIAGNOSE_REAL_CMS_ONLY' && inputs.confirmation != 'INSPECT_CMS_CERTIFICATES_ONLY')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source, order, binding and failure-path tests without credentials
        run: node --test tests/test2-presign*.test.mjs
      - name: Actual macOS Security API tests using disposable synthetic CA and identities
        run: node tests/test2-presign-crypto.mjs
      - name: Inspection encryption and native compilation (no credentials)
        run: node --test scripts/cms-signer-inspection.test.mjs
      - name: Existing Windows request entry with fully mocked I/O
        shell: pwsh
        run: ./tests/testflight-command.test.ps1

  real-cms-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DIAGNOSE_REAL_CMS_ONLY' && (github.ref == 'refs/heads/release/ios-review-candidate-20261011' || github.ref == 'refs/heads/codex/test2-apple-cms-policy-20261122')
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Bind dispatch input to workflow source before checkout
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - name: Verify exact diagnostic source before secret access
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          CANDIDATE_PULL_REQUEST: ${{ inputs.candidate_pull_request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          node scripts/test2-diagnostic-source.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate real materials only; never stage or sign
        env:
          TARGET_ENV: test2
          ROOOM_MARKETING_VERSION: '1.6.2'
          # Historical incident context only: no Apple allocation/upload.
          ROOOM_TESTFLIGHT_BUILD_NUMBER: '100083'
          ROOOM_INTERNAL_ONLY: '<key>testFlightInternalTestingOnly</key><true/>'
          ROOOM_BUILD_CONDITIONS: '$(inherited) ROOOM_IMOBILE_ADS ROOOM_TEST2_RAIL'
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: node scripts/test2-presign.mjs --diagnose-only

  cms-certificate-inspection:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'INSPECT_CMS_CERTIFICATES_ONLY' && github.ref == 'refs/heads/release/ios-review-candidate-20261011'
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - name: Verify exact diagnostic source before secret access
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(gh api repos/rooom-talk/rooom-ios/branches/release/ios-review-candidate-20261011 --jq .commit.sha)" = "$APPROVED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect signed certificate chains into encrypted evidence only
        env:
          TARGET_ENV: test2
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: node scripts/cms-signer-inspection.mjs
