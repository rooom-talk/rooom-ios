name: TEST2 Apple version eligibility (read only)
on:
  pull_request:
    paths:
      - 'scripts/*testflight*'
      - '.github/workflows/main.yml'
      - '.github/workflows/testflight-version-check.yml'
      - 'tests/testflight-version.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/testflight-version.test.mjs
      - name: Read Apple eligibility only; no build, signing or upload
        env:
          TARGET_ENV: test2
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: node scripts/apple-testflight-preflight.mjs --version-only
