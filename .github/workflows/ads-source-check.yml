name: Native ads source and policy checks (no upload)
on:
  pull_request:
    paths:
      - 'ios/App/App/RooomImobileBanner.swift'
      - 'ios/App/App/SceneDelegate.swift'
      - 'public/rooom-initial-ad-layout.json'
      - 'scripts/sync-initial-ad-layout.mjs'
      - 'scripts/*imobile*'
      - 'scripts/check-ad-source.sh'
      - 'tests/*'
      - '.github/workflows/ads-source-check.yml'
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact merged commit to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha || github.sha }}
      - name: Verify manually selected source
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check source, Xcode project patcher and pure Swift layout
        run: sh scripts/check-ad-source.sh
      - name: Exercise document-end native bootstrap in real WKWebView (no SDK or Firebase writes)
        run: |
          set -eu
          cp tests/wk-bootstrap-main.swift "$RUNNER_TEMP/main.swift"
          swiftc ios/App/App/RooomImobileBanner.swift "$RUNNER_TEMP/main.swift" -o "$RUNNER_TEMP/wk-bootstrap"
          "$RUNNER_TEMP/wk-bootstrap" --baseline
          "$RUNNER_TEMP/wk-bootstrap"
          "$RUNNER_TEMP/wk-bootstrap" --phone
          "$RUNNER_TEMP/wk-bootstrap" --home
          "$RUNNER_TEMP/wk-bootstrap" --external
